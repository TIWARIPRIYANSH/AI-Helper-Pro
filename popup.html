<!DOCTYPE html>
<html>
<head>
  <title>AI Helper Pro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 10px;
      background-color: #f0f2f5;
      color: #333;
      margin: 0;
    }
    h3 {
      text-align: center;
      color: #1a73e8;
      margin-top: 5px;
      margin-bottom: 15px;
    }
    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin-bottom: 10px;
      transition: background-color 0.2s ease;
    }
    button:hover:not(:disabled) {
      background-color: #0c62c9;
    }
    button:disabled {
      background-color: #a0c3ff;
      cursor: not-allowed;
    }
    #status {
      text-align: center;
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      background-color: #e6f7ff;
      color: #333;
      display: none; /* Hidden by default */
      word-wrap: break-word; /* Prevents overflow */
    }
    #result {
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #fff;
      display: none; /* Hidden by default */
      max-height: 200px; /* Limit height */
      overflow-y: auto; /* Scroll if content overflows */
      word-wrap: break-word; /* Ensures long text wraps */
    }
    #result strong {
      color: #1a73e8;
    }
    #result hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 10px 0;
    }
    #screenshotImg {
      max-width: 100%;
      height: auto;
      margin-top: 10px;
      border: 1px solid #ccc;
      display: none; /* Hidden by default */
    }
    #retryBtn {
      background-color: #6c757d;
      margin-top: 10px;
      display: none; /* Hidden by default */
    }
    #retryBtn:hover:not(:disabled) {
      background-color: #5a6268;
    }
  </style>
</head>
<body>
  <h3>AI Helper Pro</h3>

  <button id="findContentBtn">Find Answer (Current Content)</button>
  <button id="screenshotBtn">Take Screenshot & Find Answer</button>

  <div id="status"></div> <img id="screenshotImg" alt="Captured Screenshot">

  <div id="result"></div> <button id="retryBtn">Clear & Retry</button>

  <script src="popup.js"></script>
</body>
</html>
